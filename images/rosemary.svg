<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="300">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5c2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d7d3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d5a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a4a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Woody main stem -->
  <path d="M100,180 Q100,140 95,100 Q90,60 85,30" fill="none" stroke="url(#roseStemGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Branches -->
  <path d="M95,100 Q80,90 60,85" fill="none" stroke="url(#roseStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M90,70 Q110,65 135,60" fill="none" stroke="url(#roseStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M95,130 Q75,125 55,120" fill="none" stroke="url(#roseStemGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M90,50 Q105,45 125,40" fill="none" stroke="url(#roseStemGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle-like leaves -->
  <g fill="url(#roseGrad)" stroke="url(#roseGrad)" stroke-width="1">
    <!-- Main stem needles -->
    <path d="M95,170 L80,160 L95,155" />
    <path d="M97,170 L112,160 L97,155" />
    <path d="M95,150 L78,142 L95,138" />
    <path d="M97,150 L114,142 L97,138" />
    <path d="M95,130 L78,122 L95,118" />
    <path d="M97,130 L114,122 L97,118" />
    <path d="M95,110 L78,102 L95,98" />
    <path d="M97,110 L114,102 L97,98" />
    <path d="M95,90 L78,82 L95,78" />
    <path d="M97,90 L114,82 L97,78" />
    <path d="M95,70 L78,62 L95,58" />
    <path d="M97,70 L114,62 L97,58" />
    <path d="M95,50 L78,42 L95,38" />
    <path d="M97,50 L114,42 L97,38" />
    <path d="M95,35 L78,28 L95,24" />
    <path d="M97,35 L114,28 L97,24" />
    <!-- Branch needles -->
    <path d="M70,90 L60,80 L70,75" />
    <path d="M72,90 L82,80 L72,75" />
    <path d="M65,110 L55,100 L65,95" />
    <path d="M67,110 L77,100 L67,95" />
    <path d="M120,65 L130,55 L120,50" />
    <path d="M122,65 L132,55 L122,50" />
    <path d="M115,85 L125,75 L115,70" />
    <path d="M117,85 L127,75 L117,70" />
    <!-- Small blue flowers -->
    <circle cx="80" cy="25" r="3" fill="#6a8eff" stroke="#4a6ecc" stroke-width="0.5"/>
    <circle cx="115" cy="22" r="3" fill="#6a8eff" stroke="#4a6ecc" stroke-width="0.5"/>
    <circle cx="75" cy="45" r="3" fill="#6a8eff" stroke="#4a6ecc" stroke-width="0.5"/>
    <circle cx="120" cy="42" r="3" fill="#6a8eff" stroke="#4a6ecc" stroke-width="0.5"/>
  </g>
</svg>