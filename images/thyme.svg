<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="300">
  <defs>
    <linearGradient id="thymeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5db85a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thymeStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a1a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="flowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8c8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8a8c8;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Low spreading stems -->
  <path d="M100,160 Q90,140 70,130 Q50,120 35,115" fill="none" stroke="url(#thymeStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,160 Q110,140 130,130 Q150,120 165,115" fill="none" stroke="url(#thymeStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,160 Q95,120 85,90 Q75,60 65,40" fill="none" stroke="url(#thymeStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,160 Q105,120 115,90 Q125,60 135,40" fill="none" stroke="url(#thymeStemGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Tiny leaves -->
  <g fill="url(#thymeGrad)">
    <!-- Stem 1 leaves -->
    <ellipse cx="85" cy="135" rx="4" ry="2" transform="rotate(-20 85 135)"/>
    <ellipse cx="75" cy="125" rx="4" ry="2" transform="rotate(-15 75 125)"/>
    <ellipse cx="65" cy="120" rx="4" ry="2" transform="rotate(-10 65 120)"/>
    <ellipse cx="55" cy="118" rx="4" ry="2" transform="rotate(-5 55 118)"/>
    <ellipse cx="45" cy="116" rx="4" ry="2"/>
    <!-- Stem 2 leaves -->
    <ellipse cx="115" cy="135" rx="4" ry="2" transform="rotate(20 115 135)"/>
    <ellipse cx="125" cy="125" rx="4" ry="2" transform="rotate(15 125 125)"/>
    <ellipse cx="135" cy="120" rx="4" ry="2" transform="rotate(10 135 120)"/>
    <ellipse cx="145" cy="118" rx="4" ry="2" transform="rotate(5 145 118)"/>
    <ellipse cx="155" cy="116" rx="4" ry="2"/>
    <!-- Stem 3 leaves -->
    <ellipse cx="95" cy="105" rx="4" ry="2" transform="rotate(-25 95 105)"/>
    <ellipse cx="90" cy="90" rx="4" ry="2" transform="rotate(-20 90 90)"/>
    <ellipse cx="85" cy="75" rx="4" ry="2" transform="rotate(-15 85 75)"/>
    <ellipse cx="80" cy="60" rx="4" ry="2" transform="rotate(-10 80 60)"/>
    <ellipse cx="75" cy="45" rx="4" ry="2" transform="rotate(-5 75 45)"/>
    <!-- Stem 4 leaves -->
    <ellipse cx="105" cy="105" rx="4" ry="2" transform="rotate(25 105 105)"/>
    <ellipse cx="110" cy="90" rx="4" ry="2" transform="rotate(20 110 90)"/>
    <ellipse cx="115" cy="75" rx="4" ry="2" transform="rotate(15 115 75)"/>
    <ellipse cx="120" cy="60" rx="4" ry="2" transform="rotate(10 120 60)"/>
    <ellipse cx="125" cy="45" rx="4" ry="2" transform="rotate(5 125 45)"/>
  </g>
  <!-- Small pink/purple flowers -->
  <g fill="url(#flowerGrad)">
    <circle cx="70" cy="115" r="4"/>
    <circle cx="130" cy="115" r="4"/>
    <circle cx="80" cy="85" r="4"/>
    <circle cx="120" cy="85" r="4"/>
    <circle cx="75" cy="50" r="4"/>
    <circle cx="125" cy="50" r="4"/>
    <circle cx="95" cy="35" r="4"/>
    <circle cx="105" cy="35" r="4"/>
    <!-- Flower centers -->
    <circle cx="70" cy="115" r="1.5" fill="#a888a8"/>
    <circle cx="130" cy="115" r="1.5" fill="#a888a8"/>
    <circle cx="80" cy="85" r="1.5" fill="#a888a8"/>
    <circle cx="120" cy="85" r="1.5" fill="#a888a8"/>
    <circle cx="75" cy="50" r="1.5" fill="#a888a8"/>
    <circle cx="125" cy="50" r="1.5" fill="#a888a8"/>
    <circle cx="95" cy="35" r="1.5" fill="#a888a8"/>
    <circle cx="105" cy="35" r="1.5" fill="#a888a8"/>
  </g>
</svg>